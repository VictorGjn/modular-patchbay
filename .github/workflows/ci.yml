name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - run: npm ci
      
      - name: TypeScript check
        run: npx tsc --noEmit
      
      - name: Build
        run: npm run build
      
      - name: Unit tests
        run: npx vitest run --reporter=verbose
      
      - name: Server build
        run: npm run build:server
